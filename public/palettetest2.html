<!doctype html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<style>
/* A: absolute url, no font-display (like the original palettetest) */
@font-face { font-family:'t342'; src:url('http://localhost:3000/data/quran/v4/fonts/p342.woff2') format('woff2'); }
@font-palette-values t-light { font-family:'t342'; base-palette:0; }
@font-palette-values t-dark { font-family:'t342'; base-palette:1; }
.pa { font-palette: t-light; }
.pa-dark { font-palette: t-dark; }

/* B: relative url, WITH font-display swap */
@font-face { font-family:'p2b'; src:url('/data/quran/v4/fonts/p2.woff2') format('woff2'); font-display: swap; }
@font-palette-values b-light { font-family:'p2b'; base-palette:0; }
@font-palette-values b-dark { font-family:'p2b'; base-palette:1; }
.pb { font-palette: b-light; }
.pb-dark { font-palette: b-dark; }
</style>
</head>
<body style="background:#ddd">
  <div class="pa" style="font-family:'t342';font-size:60px" id="a">&#xFC41;&#xFC42;&#xFC43;&#xFC44;</div>
  <div class="pa-dark" style="font-family:'t342';font-size:60px;background:#17191c" id="b">&#xFC41;&#xFC42;&#xFC43;&#xFC44;</div>
  <div class="pb" style="font-family:'p2b';font-size:60px" id="c">&#xFC41;&#xFC42;&#xFC43;&#xFC44;</div>
  <div class="pb-dark" style="font-family:'p2b';font-size:60px;background:#17191c" id="d">&#xFC41;&#xFC42;&#xFC43;&#xFC44;</div>
</body>
</html>
