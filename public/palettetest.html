<!doctype html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 't342';
    src: url('http://localhost:3000/data/quran/v4/fonts/p342.woff2') format('woff2');
  }
  @font-palette-values t-light { font-family: 't342'; base-palette: 0; }
  @font-palette-values t-dark  { font-family: 't342'; base-palette: 1; }
  @font-palette-values t-sepia { font-family: 't342'; base-palette: 2; }
  body { margin: 20px; background: #ccc; }
  .row { display: flex; gap: 20px; }
  .cell { background: #fff; padding: 10px; }
  .cell.dark { background: #17191c; }
  .txt { font-family: 't342'; font-size: 60px; line-height: 1.4; white-space: nowrap; }
  .p0 { font-palette: t-light; }
  .p1 { font-palette: t-dark; }
  .p2 { font-palette: t-sepia; }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><div class="txt p0" id="a">&#xFC41;&#xFC42;&#xFC43;&#xFC44;</div><div style="font-size:12px">palette 0 (light) on white</div></div>
  <div class="cell dark"><div class="txt p1" id="b">&#xFC41;&#xFC42;&#xFC43;&#xFC44;</div><div style="font-size:12px;color:#888">palette 1 (dark) on black</div></div>
  <div class="cell"><div class="txt p2" id="c">&#xFC41;&#xFC42;&#xFC43;&#xFC44;</div><div style="font-size:12px">palette 2 (sepia) on white</div></div>
  <div class="cell dark"><div class="txt" id="d">&#xFC41;&#xFC42;&#xFC43;&#xFC44;</div><div style="font-size:12px;color:#888">no palette on black</div></div>
</div>
<script>
window.result = {};
document.fonts.ready.then(() => {
  window.result.fontOk = document.fonts.check('60px "t342"');
});
</script>
</body>
</html>
